<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎉 Jogos de Festa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #17171b;
    --panel-edge: #232328;
    --fuse: #ff7a2f;
    --fuse-dim: #7a3d17;
    --danger: #ff3b3b;
    --safe: #45d483;
    --hazard: #ffcc00;
    --spy: #7aa2ff;
    --spy-dim: #26355e;
    --text: #ecece7;
    --text-dim: #8b8b92;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Oswald', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 50% -10%, #241309 0%, var(--bg) 45%);
    color: var(--text);
    max-width: 620px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  h1 {
    font-size: 22px;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .fuse-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--fuse);
    box-shadow: 0 0 10px 2px var(--fuse);
    animation: piscar 1.4s ease-in-out infinite;
  }
  @keyframes piscar { 50% { opacity: .35; } }

  .subtitulo { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }

  /* ---------- Login ---------- */
  #login {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 22px;
  }
  #login label {
    display: block; font-size: 12px; color: var(--text-dim);
    margin: 14px 0 6px; letter-spacing: .03em;
  }
  #login label:first-child { margin-top: 0; }
  input, select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    width: 100%;
    padding: 11px 12px;
    background: #0f0f12;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--fuse); }

  button {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: .03em;
    font-size: 15px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 13px 18px;
    background: var(--fuse);
    color: #1a0d02;
    transition: transform .08s, filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }
  button.secundario {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--panel-edge);
  }
  button.secundario:hover { color: var(--text); border-color: var(--fuse-dim); }
  button.pequeno { padding: 9px 12px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }

  #entrar-btn { width: 100%; margin-top: 18px; }

  /* seletor de modo de jogo */
  .modo-grade {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .modo-opcao {
    background: #0f0f12;
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .modo-opcao .emoji { font-size: 26px; display: block; margin-bottom: 6px; }
  .modo-opcao .titulo { font-size: 13px; font-weight: 600; }
  .modo-opcao .desc { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .modo-opcao.selecionado { border-color: var(--fuse); box-shadow: 0 0 0 1px var(--fuse); }
  .modo-opcao.selecionado.detetive { border-color: var(--spy); box-shadow: 0 0 0 1px var(--spy); }

  /* ---------- Jogo (comum) ---------- */
  #jogo-bomb, #jogo-detetive { display: none; }

  .status-linha {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 16px; font-size: 13px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .status-linha .codigo-sala {
    font-family: 'JetBrains Mono', monospace;
    color: var(--fuse);
    letter-spacing: .05em;
    cursor: pointer;
  }
  #jogo-detetive .codigo-sala { color: var(--spy); }
  .status-acoes { display: flex; gap: 6px; }

  .lista-jogadores {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 20px;
  }
  .jog {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
    transition: border-color .2s, box-shadow .2s;
  }
  .jog .nome { color: var(--text); font-weight: 500; }
  .jog .vidas { font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; }
  .jog.vez {
    border-color: var(--fuse);
    box-shadow: 0 0 0 1px var(--fuse), 0 0 14px -2px var(--fuse);
  }
  #jogo-detetive .jog.vez {
    border-color: var(--spy);
    box-shadow: 0 0 0 1px var(--spy), 0 0 14px -2px var(--spy);
  }
  .jog.eliminado { opacity: .35; text-decoration: line-through; }
  .jog.voce { outline: 1px dashed var(--text-dim); outline-offset: 2px; }

  /* ---------- Painel do detonador (bomba) ---------- */
  #painel-bomb {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 34px 24px 26px;
    text-align: center;
    overflow: hidden;
    transition: box-shadow .25s;
  }
  #painel-bomb::before {
    content: '';
    position: absolute; inset: 0;
    background-repeat: repeat-x;
    background-size: 26px 10px;
    background-image: repeating-linear-gradient(45deg, var(--hazard) 0 6px, transparent 6px 12px);
    opacity: .5;
    height: 6px; top: 0;
  }

  #anel-wrap { position: relative; width: 176px; height: 176px; margin: 6px auto 14px; }
  #anel-wrap svg { transform: rotate(-90deg); width: 176px; height: 176px; }
  #anel-fundo { fill: none; stroke: var(--panel-edge); stroke-width: 8; }
  #anel-progresso {
    fill: none; stroke: var(--fuse); stroke-width: 8; stroke-linecap: round;
    transition: stroke .25s;
  }
  #centro-anel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #silaba {
    font-size: 40px; font-weight: 700; letter-spacing: .02em;
    color: var(--text);
    text-transform: uppercase;
  }
  #tempo-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 600;
    color: var(--text-dim);
    margin-top: 2px;
  }

  #vez-de { font-size: 14px; color: var(--text-dim); margin-bottom: 4px; }
  #vez-de b { color: var(--text); font-weight: 600; }

  #painel-bomb.urgente #anel-progresso { stroke: var(--danger); }
  #painel-bomb.urgente #silaba { animation: tremer .25s infinite; color: var(--danger); }
  @keyframes tremer {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }

  #painel-bomb.flash-acerto { box-shadow: 0 0 0 2px var(--safe), 0 0 40px -6px var(--safe); }
  #painel-bomb.flash-erro { box-shadow: 0 0 0 2px var(--danger), 0 0 40px -6px var(--danger); animation: explodir .4s; }
  @keyframes explodir {
    0% { transform: scale(1); }
    30% { transform: scale(1.02) rotate(-.4deg); }
    60% { transform: scale(.99) rotate(.4deg); }
    100% { transform: scale(1); }
  }

  #resultado-banner {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .03em;
    min-height: 18px;
    opacity: 0;
    transition: opacity .2s;
  }
  #resultado-banner.mostrar { opacity: 1; }
  #resultado-banner.ok { color: var(--safe); }
  #resultado-banner.falha { color: var(--danger); }

  #form-palavra { display: flex; gap: 8px; margin-top: 22px; }
  #palavra { flex: 1; font-size: 16px; padding: 13px 14px; text-align: center; letter-spacing: .02em; }
  #palavra.sua-vez { border-color: var(--fuse); }
  #palavra:disabled { opacity: .5; }

  #placar-final {
    margin-top: 16px; text-align: left; font-size: 13px;
    display: none; flex-direction: column; gap: 4px;
  }
  #placar-final .linha-placar {
    display: flex; justify-content: space-between;
    background: #0f0f12; border-radius: 6px; padding: 7px 10px;
  }
  #placar-final .linha-placar.campeao { color: var(--hazard); font-weight: 600; }

  /* ---------- Painel do detetive ---------- */
  #painel-detetive {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 24px;
  }
  #config-detetive {
    display: flex; gap: 10px; align-items: flex-end; margin-bottom: 14px; flex-wrap: wrap;
  }
  #config-detetive > div { flex: 1; min-width: 140px; }
  #config-detetive label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }

  .carta-palavra {
    background: linear-gradient(135deg, var(--spy-dim), #14182a);
    border: 1px solid var(--spy);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
  }
  .carta-palavra .rotulo { font-size: 11px; color: var(--text-dim); letter-spacing: .08em; text-transform: uppercase; }
  .carta-palavra .valor { font-size: 30px; font-weight: 700; color: var(--text); margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; transition: color .15s; }
  .carta-palavra.impostora .valor { color: var(--danger); }
  .carta-palavra .valor.escondida { color: var(--text-dim); }
  .carta-palavra .btn-revelar { margin-top: 12px; }

  #fase-titulo { text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 10px; }
  #fase-titulo b { color: var(--text); }

  #lista-dicas { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .item-dica {
    background: #0f0f12; border: 1px solid var(--panel-edge); border-radius: 7px;
    padding: 8px 12px; font-size: 13px; display: flex; gap: 8px;
  }
  .item-dica .quem { color: var(--spy); font-weight: 600; }

  #form-dica { display: flex; gap: 8px; }
  #dica-input { flex: 1; font-size: 15px; padding: 12px 14px; }
  #dica-input:disabled { opacity: .5; }

  #grade-votos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .voto-btn {
    background: #0f0f12; border: 1px solid var(--panel-edge); color: var(--text);
    padding: 12px; border-radius: 8px; font-size: 13px; text-align: left;
  }
  .voto-btn:hover:not(:disabled) { border-color: var(--danger); }
  .voto-btn.escolhido { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

  #revelacao-final { display: none; text-align: center; }
  #revelacao-final .veredito { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  #revelacao-final .veredito.detetives { color: var(--safe); }
  #revelacao-final .veredito.impostores { color: var(--danger); }

  /* ---------- Log ---------- */
  .log-titulo { font-size: 12px; color: var(--text-dim); letter-spacing: .05em; margin: 24px 0 8px; }
  .log-caixa {
    background: #0f0f12; border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 6px; height: 190px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
  }
  .log-item {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    padding: 7px 10px; border-radius: 5px; background: #17171b; color: var(--text-dim);
    display: flex; gap: 8px;
  }
  .log-item.ok { color: var(--safe); background: #10241a; }
  .log-item.erro { color: var(--danger); background: #241012; }
  .log-item.info { color: var(--fuse); background: #241a10; }
  .log-item.fim { color: var(--hazard); background: #241f10; font-weight: 600; }
  #jogo-detetive .log-item.info { color: var(--spy); background: #12183a; }
</style>
</head>
<body>

<h1><span class="fuse-dot"></span> JOGOS DE FESTA</h1>
<div class="subtitulo">Multiplayer em tempo real — crie ou entre em uma sala e jogue.</div>

<div id="login">
  <label>Escolha o jogo</label>
  <div class="modo-grade">
    <div class="modo-opcao selecionado" id="modo-bomb" data-modo="bomb">
      <span class="emoji">💣</span>
      <span class="titulo">Bomb Party</span>
      <span class="desc">diga palavras antes que a bomba estoure</span>
    </div>
    <div class="modo-opcao detetive" id="modo-detetive" data-modo="detetive">
      <span class="emoji">🕵️</span>
      <span class="titulo">Detetive / Impostor</span>
      <span class="desc">ache quem recebeu a palavra errada</span>
    </div>
  </div>
  <label for="codigo">Código da sala</label>
  <input id="codigo" placeholder="ex: sala1" autocomplete="off">
  <label for="nome">Seu nome</label>
  <input id="nome" placeholder="ex: Ana" autocomplete="off" maxlength="20">
  <button id="entrar-btn">Entrar na sala</button>
</div>

<!-- =================== BOMB PARTY =================== -->
<div id="jogo-bomb">
  <div class="status-linha">
    <span>Sala: <span class="codigo-sala" id="codigo-exibido-bomb" title="clique para copiar">-</span></span>
    <div class="status-acoes">
      <button class="secundario pequeno" id="iniciar-btn-bomb" style="display:none">Iniciar partida</button>
      <button class="secundario pequeno" id="sair-btn-bomb">Sair</button>
    </div>
  </div>

  <div id="jogadores-bomb" class="lista-jogadores"></div>

  <div id="painel-bomb">
    <div id="vez-de">aguardando início...</div>
    <div id="anel-wrap">
      <svg viewBox="0 0 60 60">
        <circle id="anel-fundo" cx="30" cy="30" r="26"></circle>
        <circle id="anel-progresso" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="0"></circle>
      </svg>
      <div id="centro-anel">
        <div id="silaba">-</div>
        <div id="tempo-num">--</div>
      </div>
    </div>
    <div id="resultado-banner"></div>

    <form id="form-palavra">
      <input id="palavra" placeholder="digite uma palavra..." disabled autocomplete="off">
      <button type="submit">Enviar</button>
    </form>

    <div id="placar-final"></div>
  </div>

  <div class="log-titulo">REGISTRO DA PARTIDA</div>
  <div class="log-caixa" id="log-bomb"></div>
</div>

<!-- =================== DETETIVE / IMPOSTOR =================== -->
<div id="jogo-detetive">
  <div class="status-linha">
    <span>Sala: <span class="codigo-sala" id="codigo-exibido-det" title="clique para copiar">-</span></span>
    <div class="status-acoes">
      <button class="secundario pequeno" id="sair-btn-det">Sair</button>
    </div>
  </div>

  <div id="jogadores-det" class="lista-jogadores"></div>

  <div id="painel-detetive">
    <div id="config-detetive" style="display:none">
      <div>
        <label for="num-impostores">Impostores</label>
        <select id="num-impostores">
          <option value="1">1 impostor</option>
          <option value="2">2 impostores (6+ jogadores)</option>
        </select>
      </div>
      <button id="iniciar-btn-det">Iniciar partida</button>
    </div>

    <div id="minha-carta"></div>

    <div id="fase-titulo">aguardando início...</div>

    <div id="lista-dicas"></div>

    <form id="form-dica" style="display:none">
      <input id="dica-input" placeholder="dê uma dica sobre sua palavra..." autocomplete="off">
      <button type="submit">Enviar</button>
    </form>

    <div id="grade-votos" style="display:none"></div>

    <div id="revelacao-final">
      <div class="veredito" id="veredito-texto"></div>
      <div id="revelacao-detalhe" style="font-size:13px; color:var(--text-dim);"></div>
    </div>
  </div>

  <div class="log-titulo">REGISTRO DA PARTIDA</div>
  <div class="log-caixa" id="log-det"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot,
  collection, addDoc, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ============================================================
// CONFIGURAÇÃO DO FIREBASE (config WEB, é pública — NÃO é a chave.json)
// Console Firebase > Configurações do projeto > Seus apps > App da Web
// ============================================================
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "bomb-text-9bbf6.firebaseapp.com",
  projectId: "bomb-text-9bbf6",
  appId: "COLE_AQUI"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const dormir = (ms) => new Promise((r) => setTimeout(r, ms));
function embaralhar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function logTo(containerId, mensagem, tipo = '') {
  const el = $(containerId);
  const item = document.createElement('div');
  item.className = 'log-item' + (tipo ? ' ' + tipo : '');
  item.textContent = mensagem;
  el.appendChild(item);
  el.scrollTop = el.scrollHeight;
}
function copiarCodigo(texto) {
  navigator.clipboard?.writeText(texto).catch(() => {});
}

// identidade persistente apenas dentro desta aba/sessão (sessionStorage, não localStorage!).
// Cada aba/janela do navegador precisa ter seu próprio ID — se usássemos localStorage,
// duas pessoas testando em abas diferentes no mesmo navegador cairiam no MESMO id e
// sobrescreveriam o documento uma da outra no Firestore.
let meuId = sessionStorage.getItem('jf_meu_id');
if (!meuId) { meuId = crypto.randomUUID(); sessionStorage.setItem('jf_meu_id', meuId); }

// ============================================================
// SELETOR DE MODO NA TELA DE LOGIN
// ============================================================
let modoSelecionado = 'bomb';
$('modo-bomb').addEventListener('click', () => selecionarModo('bomb'));
$('modo-detetive').addEventListener('click', () => selecionarModo('detetive'));
function selecionarModo(modo) {
  modoSelecionado = modo;
  $('modo-bomb').classList.toggle('selecionado', modo === 'bomb');
  $('modo-detetive').classList.toggle('selecionado', modo === 'detetive');
}

$('entrar-btn').addEventListener('click', () => {
  if (modoSelecionado === 'bomb') conectarBomb(); else conectarDetetive();
});
$('codigo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('nome').focus(); });
$('nome').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { modoSelecionado === 'bomb' ? conectarBomb() : conectarDetetive(); }
});

/* ============================================================
   ====================   BOMB PARTY   =======================
   ============================================================ */

const SILABAS = [
  // Sílabas simples
  "ba","be","bi","bo","bu",
  "ca","ce","ci","co","cu",
  "da","de","di","do","du",
  "fa","fe","fi","fo","fu",
  "ga","ge","gi","go","gu",
  "ja","je","ji","jo","ju",
  "la","le","li","lo","lu",
  "ma","me","mi","mo","mu",
  "na","ne","ni","no","nu",
  "pa","pe","pi","po","pu",
  "ra","re","ri","ro","ru",
  "sa","se","si","so","su",
  "ta","te","ti","to","tu",
  "va","ve","vi","vo","vu",

  // Finais frequentes
  "ar","er","ir","or","ur",
  "an","en","in","on","un",
  "as","es","is","os","us",
  "am","em","im","om","um",
  "al","el","il","ol","ul",

  // Encontros consonantais comuns
  "bra","bre","bri","bro","bru",
  "cla","cle","cli","clo","clu",
  "cra","cre","cri","cro","cru",
  "dra","dre","dri","dro","dru",
  "fra","fre","fri","fro","fru",
  "gra","gre","gri","gro","gru",
  "pla","ple","pli","plo","plu",
  "pra","pre","pri","pro","pru",
  "tra","tre","tri","tro","tru",

  // Combinações muito comuns
  "que","qui",
  "gue","gui",
  "qua","quo",
  "cha","che","chi","cho","chu",
  "lha","lhe","lhi","lho","lhu",
  "nha","nhe","nhi","nho","nhu",

  // Terminações frequentes
  "bar","ber","bir","bor","bur",
  "car","cer","cir","cor","cur",
  "dar","der","dir","dor","dur",
  "mar","mer","mir","mor","mur",
  "par","per","pir","por","pur",
  "tar","ter","tir","tor","tur",

  // Sufixos muito comuns
  "ção","são","tão","rão","mão",
  "ções","sões",
  "mento","mente",
  "dade",

  // Prefixos/encontros frequentes
  "con","com",
  "des","dis",
  "sub","sup",
  "sob","sobre",
  "trans","inter",
  "extra","anti","auto","super","multi"
];
const VIDAS_INICIAIS = 3;
const TEMPO_INICIAL = 10.0;
const TEMPO_MINIMO = 5.0;
const DECREMENTO_TEMPO = 0.4;

let codigoBomb = null, meuNomeBomb = "Jogador";
let pRef = null;
let partida = null;
let jogadoresBomb = {};
let ultimosNomesBomb = {};
let turnoAtualBomb = null;
let ultimoTurnoN = 0, ultimoEventoN = 0, ultimoAvisoN = 0;

let temporizador = null, tempoTotalTurno = 0, tempoRestanteTurno = 0;
const CIRCUNFERENCIA = 2 * Math.PI * 26;
$('anel-progresso').setAttribute('stroke-dasharray', CIRCUNFERENCIA.toFixed(2));

const nomeDeBomb = (id) => ultimosNomesBomb[id] || String(id).slice(0, 4);

async function conectarBomb() {
  codigoBomb = $('codigo').value.trim();
  meuNomeBomb = $('nome').value.trim() || "Jogador";
  if (!codigoBomb) { alert("Digite o código da sala"); return; }
  if (codigoBomb.includes('/')) { alert("O código não pode conter '/'"); return; }

  const btn = $('entrar-btn');
  btn.disabled = true; btn.textContent = "Conectando...";

  try {
    pRef = doc(db, "partidas", codigoBomb);
    const snap = await getDoc(pRef);

    if (!snap.exists()) {
      await setDoc(pRef, {
        status: "aguardando", host: meuId,
        silaba_atual: null, turno_atual: null, turno_n: 0,
        ordem_jogadores: [], tempo_por_turno: TEMPO_INICIAL,
        palavras_usadas: [], criada_em: serverTimestamp(),
        vencedor: null, evento: null, aviso: null
      });
    } else if (snap.data().status !== "aguardando" && snap.data().ordem_jogadores?.includes(meuId) === false) {
      alert("Essa partida já começou ou terminou.");
      btn.disabled = false; btn.textContent = "Entrar na sala";
      return;
    }

    const jogadorSnap = await getDoc(doc(pRef, "jogadores", meuId));
    if (!jogadorSnap.exists()) {
      await setDoc(doc(pRef, "jogadores", meuId), {
        nome: meuNomeBomb, vidas: VIDAS_INICIAIS, pontuacao: 0,
        ativo: true, entrou_em: serverTimestamp()
      });
      await updateDoc(pRef, { ordem_jogadores: arrayUnion(meuId) });
    } else {
      // reconectando (recarregou a página): mantém progresso, só reativa se ainda tinha vidas
      const d = jogadorSnap.data();
      await setDoc(doc(pRef, "jogadores", meuId), { nome: meuNomeBomb, ativo: d.vidas > 0 }, { merge: true });
    }

    $('login').style.display = 'none';
    $('jogo-bomb').style.display = 'block';
    $('codigo-exibido-bomb').textContent = codigoBomb;
    logTo('log-bomb', `Conectado à sala "${codigoBomb}" como ${meuNomeBomb}`, 'info');
    ouvirBomb();
  } catch (e) {
    console.error(e);
    alert("Erro ao conectar: " + e.message);
    btn.disabled = false; btn.textContent = "Entrar na sala";
  }
}

function sairBomb() {
  if (!pRef) return;
  updateDoc(doc(pRef, "jogadores", meuId), { ativo: false }).catch(() => {});
}
window.addEventListener('pagehide', () => { sairBomb(); sairDetetive(); });
window.addEventListener('beforeunload', () => { sairBomb(); sairDetetive(); });
$('sair-btn-bomb').addEventListener('click', () => { sairBomb(); location.reload(); });
$('codigo-exibido-bomb').addEventListener('click', () => copiarCodigo(codigoBomb));

function ouvirBomb() {
  onSnapshot(pRef, (snap) => {
    if (!snap.exists()) return;
    const primeira = partida === null;
    partida = snap.data();

    if (primeira) {
      ultimoEventoN = partida.evento?.n || 0;
      ultimoAvisoN = partida.aviso?.n || 0;
      ultimoTurnoN = partida.turno_n || 0;
    }
    atualizarBotaoIniciarBomb();

    if (partida.evento && partida.evento.n !== ultimoEventoN) {
      ultimoEventoN = partida.evento.n;
      tratarEventoBomb(partida.evento);
    }
    if (partida.aviso && partida.aviso.n !== ultimoAvisoN) {
      ultimoAvisoN = partida.aviso.n;
      if (partida.aviso.para === meuId) logTo('log-bomb', partida.aviso.mensagem, 'info');
    }
    if (partida.status === "em_andamento" && partida.turno_n !== ultimoTurnoN) {
      ultimoTurnoN = partida.turno_n;
      novoTurnoBomb(partida);
    }
  });

  onSnapshot(collection(pRef, "jogadores"), (snap) => {
    const antes = new Set(Object.keys(jogadoresBomb));
    jogadoresBomb = {};
    snap.forEach((d) => { jogadoresBomb[d.id] = d.data(); ultimosNomesBomb[d.id] = d.data().nome; });
    for (const id in jogadoresBomb) {
      if (!antes.has(id) && id !== meuId) logTo('log-bomb', `${jogadoresBomb[id].nome} entrou na sala`, 'info');
    }
    renderJogadoresBomb();
    atualizarBotaoIniciarBomb();
  });
}

function atualizarBotaoIniciarBomb() {
  const btn = $('iniciar-btn-bomb');
  const souHost = partida && partida.host === meuId && partida.status === "aguardando";
  btn.style.display = souHost ? '' : 'none';
  if (souHost) {
    const ativos = Object.values(jogadoresBomb).filter((j) => j.ativo).length;
    btn.disabled = ativos < 2;
    btn.textContent = ativos < 2 ? "Aguardando +1 jogador..." : "Iniciar partida";
  }
  if (partida && partida.status === "aguardando" && partida.host !== meuId) {
    $('vez-de').textContent = "aguardando o anfitrião iniciar...";
  }
}

function renderJogadoresBomb() {
  const container = $('jogadores-bomb');
  container.innerHTML = '';
  const ordem = partida?.ordem_jogadores?.length ? partida.ordem_jogadores : Object.keys(jogadoresBomb);
  for (const id of ordem) {
    const j = jogadoresBomb[id];
    if (!j) continue;
    const div = document.createElement('div');
    div.className = 'jog' + (id === turnoAtualBomb ? ' vez' : '') + (j.vidas <= 0 ? ' eliminado' : '') + (id === meuId ? ' voce' : '');
    const n = document.createElement('span'); n.className = 'nome'; n.textContent = j.nome;
    const v = document.createElement('span'); v.className = 'vidas'; v.textContent = '♥'.repeat(j.vidas) || '—';
    div.append(n, v);
    container.appendChild(div);
  }
}

function pararTemporizador() { if (temporizador) clearInterval(temporizador); temporizador = null; }

function iniciarTemporizador(segundos) {
  pararTemporizador();
  tempoTotalTurno = segundos; tempoRestanteTurno = segundos;
  atualizarAnel();
  temporizador = setInterval(() => {
    tempoRestanteTurno = Math.max(0, tempoRestanteTurno - 0.1);
    atualizarAnel();
    if (tempoRestanteTurno <= 0) pararTemporizador();
  }, 100);
}

function atualizarAnel() {
  const proporcao = tempoTotalTurno > 0 ? tempoRestanteTurno / tempoTotalTurno : 0;
  $('anel-progresso').setAttribute('stroke-dashoffset', (CIRCUNFERENCIA * (1 - proporcao)).toFixed(2));
  $('tempo-num').textContent = tempoRestanteTurno.toFixed(1) + 's';
  $('painel-bomb').classList.toggle('urgente', tempoRestanteTurno <= tempoTotalTurno * 0.25);
}

function mostrarResultado(texto, classe) {
  const banner = $('resultado-banner');
  banner.textContent = texto;
  banner.className = 'mostrar ' + classe;
  clearTimeout(banner._timeout);
  banner._timeout = setTimeout(() => banner.classList.remove('mostrar'), 2200);
}

function piscarPainel(classe) {
  const painel = $('painel-bomb');
  painel.classList.remove('flash-acerto', 'flash-erro');
  void painel.offsetWidth;
  painel.classList.add(classe);
  setTimeout(() => painel.classList.remove(classe), 500);
}

function novoTurnoBomb(p) {
  turnoAtualBomb = p.turno_atual;
  const souEu = turnoAtualBomb === meuId;
  $('silaba').textContent = p.silaba_atual.toUpperCase();
  const vez = $('vez-de');
  vez.innerHTML = '';
  if (souEu) { const b = document.createElement('b'); b.textContent = 'é a sua vez!'; vez.appendChild(b); }
  else {
    vez.append('vez de ');
    const b = document.createElement('b'); b.textContent = nomeDeBomb(turnoAtualBomb); vez.appendChild(b);
  }
  const campo = $('palavra');
  campo.disabled = !souEu;
  campo.classList.toggle('sua-vez', souEu);
  campo.placeholder = souEu ? `use a sílaba "${p.silaba_atual}"...` : 'aguarde sua vez...';
  if (souEu) campo.focus();
  $('iniciar-btn-bomb').style.display = 'none';
  $('placar-final').style.display = 'none';
  renderJogadoresBomb();
  iniciarTemporizador(p.tempo_por_turno);
  logTo('log-bomb', `Sílaba "${p.silaba_atual}" — vez de ${nomeDeBomb(turnoAtualBomb)}`, 'info');
}

function tratarEventoBomb(ev) {
  switch (ev.tipo) {
    case 'acerto':
      pararTemporizador();
      if (ev.jogador_id === meuId || ev.jogador_id === turnoAtualBomb) {
        piscarPainel('flash-acerto');
        mostrarResultado(`✓ "${ev.palavra}" aceita!`, 'ok');
      }
      logTo('log-bomb', `Palavra aceita: "${ev.palavra}" (+1 ponto, total ${ev.pontuacao})`, 'ok');
      break;
    case 'erro_tempo':
      pararTemporizador();
      if (ev.jogador_id === meuId) { piscarPainel('flash-erro'); mostrarResultado('✗ tempo esgotado!', 'falha'); }
      logTo('log-bomb', `${nomeDeBomb(ev.jogador_id)} não respondeu a tempo — vida perdida (restam ${ev.vidas_restantes})`, 'erro');
      if (ev.eliminado) logTo('log-bomb', `${nomeDeBomb(ev.jogador_id)} foi eliminado da partida!`, 'erro');
      break;
    case 'fim_de_jogo': {
      pararTemporizador();
      const vez = $('vez-de'); vez.innerHTML = '';
      if (ev.vencedor_nome) {
        const b = document.createElement('b'); b.textContent = ev.vencedor_nome;
        vez.append(b, ' venceu a partida!');
      } else vez.textContent = 'a partida terminou sem vencedor';
      $('silaba').textContent = '🏆';
      $('tempo-num').textContent = '';
      $('palavra').disabled = true;
      mostrarPlacarFinal();
      logTo('log-bomb', `FIM DE JOGO — vencedor: ${ev.vencedor_nome || 'ninguém'}`, 'fim');
      break;
    }
  }
}

function mostrarPlacarFinal() {
  const el = $('placar-final');
  el.innerHTML = '';
  const ranking = Object.entries(jogadoresBomb).sort((a, b) => (b[1].pontuacao || 0) - (a[1].pontuacao || 0));
  ranking.forEach(([id, j], i) => {
    const linha = document.createElement('div');
    linha.className = 'linha-placar' + (i === 0 ? ' campeao' : '');
    linha.innerHTML = `<span>${i + 1}. ${j.nome}</span><span>${j.pontuacao || 0} pts</span>`;
    el.appendChild(linha);
  });
  el.style.display = 'flex';
}

async function enviarPalavraBomb() {
  const campo = $('palavra');
  const texto = campo.value.trim();
  if (!texto || campo.disabled || !partida) return;
  campo.value = '';
  try {
    await addDoc(collection(pRef, "jogadas"), {
      jogador_id: meuId, texto, turno_n: partida.turno_n, ts: serverTimestamp()
    });
  } catch (e) { logTo('log-bomb', "Falha ao enviar palavra: " + e.message, 'erro'); }
}

const filaBomb = [];
let aguardandoBomb = null;
function empurrarBomb(item) { if (aguardandoBomb) aguardandoBomb(item); else filaBomb.push(item); }
function esperarItemBomb(ms) {
  return new Promise((resolve) => {
    if (filaBomb.length) return resolve(filaBomb.shift());
    const t = setTimeout(() => { aguardandoBomb = null; resolve(null); }, ms);
    aguardandoBomb = (item) => { clearTimeout(t); aguardandoBomb = null; resolve(item); };
  });
}

async function validarPalavraApi(palavra) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 3000);
  try {
    const r = await fetch(`https://api.dicionario-aberto.net/word/${encodeURIComponent(palavra)}`, { signal: ctrl.signal });
    if (r.status !== 200) return false;
    const dados = await r.json();
    return Array.isArray(dados) ? dados.length > 0 : !!dados;
  } catch (e) {
    console.warn("Dicionário indisponível, aceitando palavra:", e);
    return true;
  } finally { clearTimeout(t); }
}

async function aguardarJogadaBomb(jogadorAtual, tempoTurno, silaba, turnoN, usadas) {
  const inicio = performance.now();
  while (true) {
    const restante = tempoTurno * 1000 - (performance.now() - inicio);
    if (restante <= 0) return false;
    const item = await esperarItemBomb(restante);
    if (item === null) return false;
    if (item.turno_n !== turnoN) continue;

    const remetente = item.jogador_id;
    const texto = String(item.texto || '').trim().toLowerCase();

    if (remetente !== jogadorAtual) { avisarBomb(remetente, "Não é sua vez!"); continue; }
    if (!texto) continue;
    if (!texto.includes(silaba)) { avisarBomb(remetente, `A palavra precisa conter '${silaba}'.`); continue; }
    if (usadas.has(texto)) { avisarBomb(remetente, "Essa palavra já foi usada."); continue; }

    const valida = await validarPalavraApi(texto);
    if (!valida) { avisarBomb(remetente, "Palavra não encontrada no dicionário."); continue; }
    if (performance.now() - inicio > tempoTurno * 1000) return false;

    usadas.add(texto);
    const pontos = (jogadoresBomb[remetente]?.pontuacao || 0) + 1;
    await Promise.all([
      updateDoc(pRef, { palavras_usadas: arrayUnion(texto) }),
      updateDoc(doc(pRef, "jogadores", remetente), { pontuacao: pontos }),
    ]);
    await emitirBomb({ tipo: 'acerto', jogador_id: remetente, palavra: texto, pontuacao: pontos });
    return true;
  }
}

let avisoNBomb = 0, eventoNBomb = 0;
function avisarBomb(para, mensagem) {
  updateDoc(pRef, { aviso: { n: ++avisoNBomb, para, mensagem } }).catch(() => {});
}
function emitirBomb(ev) { return updateDoc(pRef, { evento: { n: ++eventoNBomb, ...ev } }); }

async function loopPartidaBomb() {
  let tempo = TEMPO_INICIAL, indice = 0, turnoN = 0;
  const usadas = new Set();

  onSnapshot(collection(pRef, "jogadas"), (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === 'added') empurrarBomb(c.doc.data()); });
  });

  while (true) {
    const ordem = partida.ordem_jogadores;
    const ativos = ordem.filter((id) => jogadoresBomb[id]?.ativo);

    if (ativos.length <= 1) {
      const vencedorId = ativos[0] || null;
      const vencedorNome = vencedorId ? jogadoresBomb[vencedorId].nome : null;
      await updateDoc(pRef, { status: "finalizada", vencedor: vencedorId });
      await emitirBomb({ tipo: 'fim_de_jogo', vencedor_id: vencedorId, vencedor_nome: vencedorNome });
      break;
    }

    const jogadorAtual = ativos[indice % ativos.length];
    indice++;
    const silaba = SILABAS[Math.floor(Math.random() * SILABAS.length)];
    turnoN++;
    filaBomb.length = 0;

    await updateDoc(pRef, {
      turno_atual: jogadorAtual, silaba_atual: silaba,
      tempo_por_turno: tempo, turno_n: turnoN
    });

    const acertou = await aguardarJogadaBomb(jogadorAtual, tempo, silaba, turnoN, usadas);

    if (acertou) {
      tempo = Math.max(TEMPO_MINIMO, tempo - DECREMENTO_TEMPO);
    } else {
      const vidas = Math.max((jogadoresBomb[jogadorAtual]?.vidas || 0) - 1, 0);
      const dados = { vidas };
      if (vidas <= 0) dados.ativo = false;
      await updateDoc(doc(pRef, "jogadores", jogadorAtual), dados);
      await emitirBomb({
        tipo: 'erro_tempo', jogador_id: jogadorAtual,
        vidas_restantes: vidas, eliminado: vidas <= 0
      });
    }
    await dormir(1200);
  }
}

async function iniciarBomb() {
  if (!partida || partida.host !== meuId) return;
  const ativos = Object.values(jogadoresBomb).filter((j) => j.ativo).length;
  if (partida.status !== "aguardando" || ativos < 2) {
    logTo('log-bomb', "Precisa de pelo menos 2 jogadores.", 'info');
    return;
  }
  await updateDoc(pRef, { status: "em_andamento" });
  loopPartidaBomb();
}

$('iniciar-btn-bomb').addEventListener('click', iniciarBomb);
$('form-palavra').addEventListener('submit', (e) => { e.preventDefault(); enviarPalavraBomb(); });

function renderJogadoresDetetive() {

      + (id === salaDet?.jogador_vez && salaDet?.status === 'dicas' ? ' vez' : '')
      + (!j.ativo ? ' eliminado' : '')
      + (id === meuId ? ' voce' : '');
    const n = document.createElement('span'); n.className = 'nome'; n.textContent = j.nome;
    div.append(n);
    container.appendChild(div);
  }
}

let ultimaCartaRenderizada = null;
let timerEsconderPalavra = null;
function renderMinhaCartaDetetive() {
  const meu = jogadoresDet[meuId];
  const el = $('minha-carta');
  if (!meu || !meu.papel) {
    el.innerHTML = '';
    ultimaCartaRenderizada = null;
    clearTimeout(timerEsconderPalavra);
    return;
  }
  // evita recriar a carta (e perder o estado de revelar/esconder) quando o
  // snapshot de jogadores atualiza por outro motivo (ex: alguém foi eliminado)
  const chave = meu.papel + '|' + meu.palavra;
  if (chave === ultimaCartaRenderizada) return;
  ultimaCartaRenderizada = chave;
  clearTimeout(timerEsconderPalavra);

  el.innerHTML = '';
  const carta = document.createElement('div');
  carta.className = 'carta-palavra' + (meu.papel === 'impostor' ? ' impostora' : '');
  carta.innerHTML = `<div class="rotulo">${meu.papel === 'impostor' ? 'sua palavra secreta' : 'sua palavra secreta'}</div>
                      <div class="valor escondida" id="valor-palavra-det">${'•'.repeat(3)}</div>
                      <button type="button" class="secundario pequeno btn-revelar" id="btn-revelar-palavra">Revelar palavra</button>`;
  el.appendChild(carta);

  const valorEl = $('valor-palavra-det');
  const btn = $('btn-revelar-palavra');
  let revelada = false;

  function atualizarCartaPalavra() {
    clearTimeout(timerEsconderPalavra);
    if (revelada) {
      valorEl.textContent = meu.palavra;
      valorEl.classList.remove('escondida');
      btn.textContent = 'Esconder palavra';
      timerEsconderPalavra = setTimeout(() => {
        revelada = false;
        atualizarCartaPalavra();
      }, TEMPO_REVELAR_PALAVRA);
    } else {
      valorEl.textContent = '•'.repeat(3);
      valorEl.classList.add('escondida');
      btn.textContent = 'Revelar palavra';
    }
  }

  btn.addEventListener('click', () => {
    revelada = !revelada;
    atualizarCartaPalavra();
  });
}

function renderFaseDicas() {
  $('config-detetive').style.display = 'none';
  $('grade-votos').style.display = 'none';
  $('revelacao-final').style.display = 'none';
  const souEu = salaDet.jogador_vez === meuId;
  const titulo = $('fase-titulo');
  const sub = salaDet.subrodada || 1;
  const totalSub = salaDet.total_subrodadas || RODADAS_DICAS_POR_VOTACAO;
  const rotuloPista = totalSub > 1 ? ` — pista ${sub}/${totalSub}` : '';
  titulo.innerHTML = souEu
    ? `<b>é a sua vez</b> de dar uma dica (rodada ${salaDet.rodada}${rotuloPista})`
    : `rodada ${salaDet.rodada}${rotuloPista} — vez de <b>${nomeDeDet(salaDet.jogador_vez)}</b> dar uma dica`;

  const listaEl = $('lista-dicas');
  listaEl.innerHTML = '';
  (salaDet.dicas_rodada || []).forEach((d) => {
    const item = document.createElement('div');
    item.className = 'item-dica';
    const marcador = totalSub > 1 && d.subrodada ? ` <span style="color:var(--text-dim)">(pista ${d.subrodada})</span>` : '';
    item.innerHTML = `<span class="quem">${nomeDeDet(d.jogador_id)}:${marcador}</span><span>${d.texto || '(sem dica)'}</span>`;
    listaEl.appendChild(item);
  });

  const form = $('form-dica');
  form.style.display = 'flex';
  $('dica-input').disabled = !souEu;
  $('dica-input').placeholder = souEu ? 'ex: "areia" (não diga a palavra!)' : 'aguarde sua vez...';
  if (souEu) $('dica-input').focus();
}

function renderFaseVotacao() {
  $('form-dica').style.display = 'none';
  $('fase-titulo').innerHTML = `<b>votação</b> — em quem você vota como impostor?`;
  const grade = $('grade-votos');
  grade.innerHTML = '';
  grade.style.display = 'grid';
  const ordem = (salaDet.ordem_jogadores || []).filter((id) => jogadoresDet[id]?.ativo);
  for (const id of ordem) {
    if (id === meuId) continue;
    const btn = document.createElement('button');
    btn.className = 'voto-btn';
    btn.textContent = jogadoresDet[id]?.nome || nomeDeDet(id);
    btn.addEventListener('click', () => votarDetetive(id, btn));
    grade.appendChild(btn);
  }
}

async function votarDetetive(alvoId, btnEl) {
  document.querySelectorAll('#grade-votos .voto-btn').forEach((b) => { b.classList.remove('escolhido'); b.disabled = true; });
  btnEl.classList.add('escolhido');
  try {
    await setDoc(doc(dRef, "votos", meuId), { alvo_id: alvoId, rodada: salaDet.rodada, ts: serverTimestamp() });
    logTo('log-det', `Você votou em ${nomeDeDet(alvoId)}`, 'info');
  } catch (e) {
    logTo('log-det', 'Falha ao votar: ' + e.message, 'erro');
    document.querySelectorAll('#grade-votos .voto-btn').forEach((b) => { b.disabled = false; });
  }
}

async function enviarDicaDetetive() {
  const campo = $('dica-input');
  const texto = campo.value.trim();
  if (!texto || campo.disabled || !salaDet) return;
  campo.value = '';
  try {
    await addDoc(collection(dRef, "dicas"), {
      jogador_id: meuId, texto, rodada: salaDet.rodada, ts: serverTimestamp()
    });
  } catch (e) { logTo('log-det', "Falha ao enviar dica: " + e.message, 'erro'); }
}

function tratarEventoDetetive(ev) {
  switch (ev.tipo) {
    case 'eliminacao':
      if (ev.sem_eliminacao) {
        logTo('log-det', `Empate na votação — ninguém foi eliminado nesta rodada.`, 'info');
      } else {
        logTo('log-det', `${nomeDeDet(ev.jogador_id)} foi eliminado! ${ev.era_impostor ? 'Era um impostor 🕵️' : 'Era inocente 😬'}`,
          ev.era_impostor ? 'ok' : 'erro');
      }
      break;
    case 'fim_de_jogo': {
      $('grade-votos').style.display = 'none';
      $('form-dica').style.display = 'none';
      $('fase-titulo').textContent = 'partida encerrada';
      const painel = $('revelacao-final');
      painel.style.display = 'block';
      const veredito = $('veredito-texto');
      veredito.className = 'veredito ' + (ev.vencedor === 'impostores' ? 'impostores' : 'detetives');
      veredito.textContent = ev.vencedor === 'impostores' ? '🎭 Os impostores venceram!' : '🔎 Os detetives venceram!';
      $('revelacao-detalhe').textContent = `Palavra dos detetives: "${ev.palavra_normal}" · Palavra do(s) impostor(es): "${ev.palavra_impostor}" · Impostor(es): ${ev.impostores_nomes.join(', ')}`;
      logTo('log-det', `FIM DE JOGO — vencedor: ${ev.vencedor}`, 'fim');
      break;
    }
  }
}

const filaDicas = [];
let aguardandoDica = null;
function empurrarDica(item) { if (aguardandoDica) aguardandoDica(item); else filaDicas.push(item); }
function esperarDica(ms) {
  return new Promise((resolve) => {
    if (filaDicas.length) return resolve(filaDicas.shift());
    const t = setTimeout(() => { aguardandoDica = null; resolve(null); }, ms);
    aguardandoDica = (item) => { clearTimeout(t); aguardandoDica = null; resolve(item); };
  });
}

let eventoNDet = 0;
function emitirDetetive(ev) { return updateDoc(dRef, { evento: { n: ++eventoNDet, ...ev } }); }

async function aguardarDicaDe(jogadorId, rodada) {
  const inicio = performance.now();
  while (true) {
    const restante = TEMPO_DICA - (performance.now() - inicio);
    if (restante <= 0) return null;
    const item = await esperarDica(restante);
    if (item === null) return null;
    if (item.rodada !== rodada || item.jogador_id !== jogadorId) continue;
    return String(item.texto || '').trim();
  }
}

async function aguardarVotosDetetive(ordemAtivos, rodada) {
  const inicio = performance.now();
  while (performance.now() - inicio < TEMPO_VOTACAO) {
    const contagem = Object.entries(votosAtuais).filter(([id, v]) => v.rodada === rodada && ordemAtivos.includes(id));
    if (contagem.length >= ordemAtivos.length) return contagem;
    await dormir(250);
  }
  return Object.entries(votosAtuais).filter(([id, v]) => v.rodada === rodada && ordemAtivos.includes(id));
}

async function loopDetetive() {
  onSnapshot(collection(dRef, "dicas"), (snap) => {
    snap.docChanges().forEach((c) => { if (c.type === 'added') empurrarDica(c.doc.data()); });
  });
  onSnapshot(collection(dRef, "votos"), (snap) => {
    votosAtuais = {};
    snap.forEach((d) => { votosAtuais[d.id] = d.data(); });
  });

  let rodada = 0;

  while (true) {
    const ordemTotal = salaDet.ordem_jogadores;
    const ativos = ordemTotal.filter((id) => jogadoresDet[id]?.ativo);
    const impostoresAtivos = ativos.filter((id) => jogadoresDet[id]?.papel === 'impostor');
    const normaisAtivos = ativos.filter((id) => jogadoresDet[id]?.papel === 'normal');

    if (impostoresAtivos.length === 0 || impostoresAtivos.length >= normaisAtivos.length) {
      const vencedor = impostoresAtivos.length === 0 ? 'detetives' : 'impostores';
      await finalizarDetetive(vencedor);
      break;
    }

    rodada++;
    filaDicas.length = 0;
    await updateDoc(dRef, {
      status: 'dicas', rodada, jogador_vez: ativos[0], dicas_rodada: [],
      subrodada: 1, total_subrodadas: RODADAS_DICAS_POR_VOTACAO
    });

    for (let sub = 1; sub <= RODADAS_DICAS_POR_VOTACAO; sub++) {
      await updateDoc(dRef, { subrodada: sub });
      for (const jid of ativos) {
        await updateDoc(dRef, { jogador_vez: jid });
        const texto = await aguardarDicaDe(jid, rodada);
        await updateDoc(dRef, { dicas_rodada: arrayUnion({ jogador_id: jid, texto: texto || '(sem dica)', subrodada: sub }) });
      }
    }

    await updateDoc(dRef, { status: 'votacao' });
    const votos = await aguardarVotosDetetive(ativos, rodada);

    const contagemPorAlvo = {};
    for (const [, v] of votos) contagemPorAlvo[v.alvo_id] = (contagemPorAlvo[v.alvo_id] || 0) + 1;
    let alvoMax = null, maxVotos = 0, empatado = false;
    for (const [alvo, n] of Object.entries(contagemPorAlvo)) {
      if (n > maxVotos) { maxVotos = n; alvoMax = alvo; empatado = false; }
      else if (n === maxVotos && n > 0) empatado = true;
    }

    if (!alvoMax || empatado) {
      await emitirDetetive({ tipo: 'eliminacao', sem_eliminacao: true });
    } else {
      const eraImpostor = jogadoresDet[alvoMax]?.papel === 'impostor';
      await updateDoc(doc(dRef, "jogadores", alvoMax), { ativo: false });
      await emitirDetetive({ tipo: 'eliminacao', jogador_id: alvoMax, era_impostor: eraImpostor, sem_eliminacao: false });
    }

    await dormir(3000);
  }
}

async function finalizarDetetive(vencedor) {
  const impostoresNomes = Object.values(jogadoresDet).filter((j) => j.papel === 'impostor').map((j) => j.nome);
  const normal = Object.values(jogadoresDet).find((j) => j.papel === 'normal')?.palavra || '?';
  const impostora = Object.values(jogadoresDet).find((j) => j.papel === 'impostor')?.palavra || '?';
  await updateDoc(dRef, { status: 'finalizada' });
  await emitirDetetive({
    tipo: 'fim_de_jogo', vencedor,
    palavra_normal: normal, palavra_impostor: impostora,
    impostores_nomes: impostoresNomes
  });
}

async function iniciarDetetive() {
  if (!salaDet || salaDet.host !== meuId) return;
  const ativos = salaDet.ordem_jogadores.filter((id) => jogadoresDet[id]?.ativo);
  if (ativos.length < MIN_JOGADORES_DET) {
    logTo('log-det', `Precisa de pelo menos ${MIN_JOGADORES_DET} jogadores.`, 'info');
    return;
  }
  const numImpostores = parseInt($('num-impostores').value, 10);
  if (numImpostores >= 2 && ativos.length < 6) {
    alert('São necessários 6+ jogadores para 2 impostores.');
    return;
  }
  const [normal, impostora] = PARES_PALAVRAS[Math.floor(Math.random() * PARES_PALAVRAS.length)];
  const embaralhados = embaralhar(ativos);
  const impostoresIds = new Set(embaralhados.slice(0, numImpostores));

  await Promise.all(ativos.map((id) => updateDoc(doc(dRef, "jogadores", id), {
    papel: impostoresIds.has(id) ? 'impostor' : 'normal',
    palavra: impostoresIds.has(id) ? impostora : normal
  })));
  await updateDoc(dRef, { status: 'em_andamento', num_impostores: numImpostores, rodada: 0, dicas_rodada: [] });
  logTo('log-det', `Partida iniciada com ${ativos.length} jogadores e ${numImpostores} impostor(es).`, 'info');
  loopDetetive();
}

$('iniciar-btn-det').addEventListener('click', iniciarDetetive);
$('form-dica').addEventListener('submit', (e) => { e.preventDefault(); enviarDicaDetetive(); });
</script>
